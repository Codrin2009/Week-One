<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Week One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,700&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Week One: an evening walk for two. The park sits on top, the card of the moment right under it, so one
   phone screen shows both. One world on purpose: dusk in the park, lanterns just lit, cards on cream paper. */
:root {
  --night: #131027;
  --surface: #1f1a3b;
  --surface2: #2b2550;
  --line: #40386b;
  --text: #f7efe9;
  --muted: #b5aad0;
  --rose: #ff7f9f;
  --rose-ink: #2a0f1b;
  --lantern: #ffc46b;
  --paper: #fff5e8;
  --paper2: #f4e4cf;
  --ink: #241a36;
  --ink-soft: #6a5a7c;
  --win: #a6e88a;
  --ec: #ff7f9f;
  --king: #5a36a8;
  --queen: #d6336c;
  --display: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --body: 'Figtree', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --ch: 270px;
  --sh: 270px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--night);
  background-image: radial-gradient(120% 60% at 50% 0%, #2a1f58 0%, rgba(42, 31, 88, 0) 70%), radial-gradient(90% 40% at 50% 100%, rgba(255, 127, 159, .12) 0%, rgba(255, 127, 159, 0) 70%);
  background-repeat: no-repeat;
  min-height: 100%;
  color: var(--text);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; -webkit-appearance: none; appearance: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--lantern); outline-offset: 2px; }
[hidden] { display: none !important; }

.wrap { max-width: 440px; margin: 0 auto; display: grid; gap: 12px; }
.wrap.is-play { --ch: 330px; --sh: 330px; }
.wrap.is-play.card-up { --sh: 176px; }
.wrap.flatview .parkbox { order: 9; }
.wrap.flatview .foot { order: 10; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.top h1 { font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1; letter-spacing: -0.02em; margin: 0; font-variation-settings: "opsz" 144; }
.top h1 i { font-style: italic; font-weight: 500; color: var(--lantern); }
.top p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.is-play .top h1 { font-size: 24px; }
.is-play .top p { display: none; }
.clockbox { display: flex; align-items: center; gap: 8px; flex: none; }
.clockbox:empty { display: none; }
.ck { font-family: var(--body); font-weight: 800; font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; padding: 9px 10px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); }
.ck.paused { color: var(--muted); }
.pausebtn { min-height: 40px; padding: 4px 11px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; font-weight: 700; font-size: 13px; }

.score { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.score:empty { display: none; }
.chip { position: relative; display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "av cn ch" "av lap ch"; align-items: center; column-gap: 8px; padding: 8px 10px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; min-width: 0; transition: border-color .25s, background .25s; }
.chip.on { border-color: var(--lantern); background: #2a2247; }
.chip.pop { animation: pop .45s ease-out; }
@keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.06); } 100% { transform: scale(1); } }
.av { grid-area: av; flex: none; width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; border: 2px solid #fff; color: #fff; }
.av.king { background: var(--king); }
.av.queen { background: var(--queen); }
.cn { grid-area: cn; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; font-size: 15px; line-height: 1.2; }
.ch { grid-area: ch; display: flex; align-items: center; gap: 4px; color: var(--rose); font-size: 18px; font-weight: 800; }
.ch b { color: var(--text); font-variant-numeric: tabular-nums; }
.lapn { grid-area: lap; font-size: 12px; color: var(--muted); line-height: 1.2; }
.chip.on .lapn { color: var(--lantern); }
.hrt { width: 18px; height: 18px; display: inline-block; vertical-align: -3px; }
.fly { position: absolute; bottom: 40%; color: var(--rose); pointer-events: none; animation: fly 1.4s ease-out both; }
.fly .hrt { width: 20px; height: 20px; }
@keyframes fly { 0% { transform: translateY(0) scale(.5); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-78px) scale(1.25) rotate(14deg); opacity: 0; } }

.parkbox { display: grid; gap: 6px; min-width: 0; }
.stage { position: relative; width: 100%; height: var(--sh); border-radius: 24px; overflow: hidden; border: 1px solid var(--line); background: linear-gradient(#17123a, #4a2f73 55%, #e98a7c); transition: height .35s cubic-bezier(.2, .7, .2, 1); }
.stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06), inset 0 -40px 50px -30px rgba(19, 16, 39, .65), inset 0 30px 40px -30px rgba(19, 16, 39, .5); }
.stagein { position: absolute; left: 0; right: 0; top: 50%; height: var(--ch); transform: translateY(-50%); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; }
.stagebtn { position: absolute; right: 10px; bottom: 10px; z-index: 2; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .25); background: rgba(19, 16, 39, .6); display: none; align-items: center; justify-content: center; }
.stagebtn svg { width: 18px; height: 18px; }
.is-play .stagebtn { display: flex; }
.viewopt { justify-self: end; max-width: 100%; }
.viewopt summary { list-style: none; min-height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; float: right; }
.viewopt summary::-webkit-details-marker { display: none; }
.viewopt summary svg { width: 15px; height: 15px; }
.viewopt[open] summary { color: var(--text); }
.viewopt .seg { clear: both; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.views:empty { display: none; }

.evb { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 9px 14px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--ec); border-left-width: 6px; font-size: 14px; }
.evb b { font-family: var(--display); font-size: 17px; font-weight: 600; }
.evb span { color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 16px; display: grid; gap: 14px; align-content: start; min-height: 200px; }
.panel > * { margin: 0; min-width: 0; }
.note { font-size: 13px; color: var(--muted); text-align: center; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--lantern); margin: 0; }
.big { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.12; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
.muted, .hint { color: var(--muted); font-size: 15px; margin: 0; }
.hint { font-size: 13px; }
.hint.strong { color: var(--lantern); font-weight: 700; }
.center { text-align: center; }
.wait { color: var(--muted); font-size: 15px; text-align: center; padding: 4px 0; }

.now { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 16px; background: var(--surface2); border: 1.5px solid var(--line); }
.now.mine { border-color: var(--rose); background: rgba(255, 127, 159, .13); }
.nowt { display: grid; gap: 1px; min-width: 0; }
.nowt b { font-size: 16px; font-weight: 800; line-height: 1.25; }
.nowt span { font-size: 14px; color: var(--muted); line-height: 1.3; }
.now.mine .nowt span { color: #e9d9e6; }

.qcard { position: relative; background: var(--paper); color: var(--ink); border-radius: 20px; box-shadow: 0 2px 0 #e3cfb6, 0 6px 0 -1px #cdb89d, 0 16px 30px rgba(0, 0, 0, .35); margin-bottom: 6px; }
.qcard.deal { animation: deal .42s cubic-bezier(.2, .8, .25, 1) both; }
@keyframes deal { from { transform: translateY(22px) rotate(-2.2deg) scale(.97); opacity: .2; } to { transform: none; opacity: 1; } }
.qhead { display: flex; align-items: center; gap: 8px; padding: 9px 14px; background: var(--tc); border-radius: 20px 20px 0 0; font-size: 13px; }
.qhead b { font-weight: 800; letter-spacing: .02em; }
.qhead span { margin-left: auto; font-weight: 600; opacity: .72; text-align: right; }
.qico { width: 20px; height: 20px; flex: none; }
.qbody { padding: 18px 18px 20px; display: grid; gap: 12px; }
.qbody > * { margin: 0; min-width: 0; }
.q { font-family: var(--display); font-weight: 600; font-size: 24px; line-height: 1.22; text-wrap: balance; font-variation-settings: "opsz" 48; }
.q.small { font-size: 18px; }
.q .or { font-style: italic; font-weight: 500; color: var(--ink-soft); font-size: .8em; padding: 0 .15em; }
.qfollow { font-size: 15px; line-height: 1.35; color: var(--ink-soft); padding-top: 10px; border-top: 1.5px dashed #dcc7ac; }
.qfollow b { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); margin-right: 6px; }
.prize { margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--lantern); color: var(--ink); font-family: var(--display); font-weight: 600; font-size: 19px; text-align: center; display: grid; gap: 2px; }
.prize span { font-family: var(--body); font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.field input:disabled { opacity: .6; }
.qsub { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.qfoot { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 16px; }
.qtag { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--paper2); color: var(--ink-soft); }
.qtag.dbl { background: var(--ink); color: var(--lantern); }

.steps { margin: 0; padding: 0; list-style: none; counter-reset: st; display: grid; gap: 6px; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 22px 1fr; gap: 9px; align-items: start; font-size: 14px; color: var(--muted); }
.steps li::before { content: counter(st); width: 22px; height: 22px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--line); color: var(--text); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.02em; color: var(--ink); white-space: nowrap; }
.pico { width: 13px; height: 13px; }
.evcard { border-left: 6px solid var(--ec); padding-left: 14px; display: grid; gap: 8px; }
.evcard > * { margin: 0; }
.evtxt { font-family: var(--display); font-size: 19px; line-height: 1.3; font-weight: 500; }
.rule { font-weight: 800; font-size: 15px; color: var(--ec); }
.verdict { font-weight: 800; font-size: 16px; margin: 0; }
.verdict.win { color: var(--win); }

.btn { min-height: 54px; padding: 12px 18px; border: 0; border-radius: 16px; background: var(--rose); color: var(--rose-ink); font-weight: 800; font-size: 17px; width: 100%; line-height: 1.2; }
.btn:active { transform: scale(0.98); }
.btn.ghost { background: transparent; color: var(--text); border: 1.5px solid var(--line); font-weight: 700; }
.btn.link { background: none; border: 0; min-height: 44px; color: var(--muted); font-weight: 700; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; width: auto; padding: 8px 4px; }
.btns { display: grid; gap: 10px; }
.row2 { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.row2:empty { display: none; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { min-height: 62px; padding: 12px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface2); font-weight: 700; font-size: 16px; text-align: center; line-height: 1.2; overflow-wrap: anywhere; }
.opt:active { transform: scale(0.98); border-color: var(--rose); }

.dice { display: flex; justify-content: center; gap: 14px; margin: 2px auto; padding: 0; border: 0; background: none; }
.d { width: 84px; height: 84px; border-radius: 22px; background: var(--paper); color: var(--ink); font-family: var(--display); font-weight: 700; font-size: 44px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 #cdb89d, 0 14px 24px rgba(0, 0, 0, .3); }
button.dice .d { animation: nudge 2.6s ease-in-out infinite; }
button.dice .d + .d { animation-delay: .18s; }
@keyframes nudge { 0%, 78%, 100% { transform: none; } 84% { transform: translateY(-5px) rotate(-4deg); } 92% { transform: translateY(0) rotate(2deg); } }
button.dice:active .d { transform: translateY(3px); box-shadow: 0 3px 0 #cdb89d; animation: none; }
.dice.ghost { opacity: 0.45; }
.dice.ghost .d { box-shadow: none; }

.rv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rv > div { background: var(--paper2); border-radius: 14px; padding: 10px 12px; display: grid; gap: 3px; min-width: 0; border: 2px solid transparent; }
.rv > div.hit { border-color: #4f9d5a; background: #e4f1d6; }
.rv .who { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
.rv .ans { font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.15; overflow-wrap: anywhere; }

.field { display: grid; gap: 6px; }
.lab { font-size: 13px; font-weight: 700; color: var(--muted); }
.field input, .curow input { min-height: 52px; padding: 10px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--night); font-size: 16px; width: 100%; min-width: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.slots { display: grid; gap: 8px; }
.slot { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--surface2); font-weight: 700; }
.slot .role { margin-left: auto; font-size: 13px; color: var(--muted); font-weight: 600; }
.slot.empty { color: var(--muted); font-weight: 500; border: 1.5px dashed var(--line); background: transparent; }
.warn { background: #4a2030; border: 1px solid #8d3a55; border-radius: 14px; padding: 10px 12px; font-size: 14px; }
.curow { display: flex; gap: 8px; }
.culist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.culist li { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; border-radius: 12px; background: var(--surface2); font-size: 14px; }
.culist li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.cux { min-height: 36px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 12px; font-weight: 700; color: var(--muted); }
.howbox { display: grid; gap: 10px; padding: 14px; border-radius: 18px; background: var(--surface2); }
.how5 { margin: 0; padding: 0; list-style: none; counter-reset: hw; display: grid; gap: 10px; }
.how5 li { counter-increment: hw; display: grid; grid-template-columns: 26px 1fr; column-gap: 10px; font-size: 14px; }
.how5 li::before { content: counter(hw); grid-row: 1 / span 2; width: 26px; height: 26px; border-radius: 50%; background: var(--lantern); color: var(--ink); font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.how5 b { font-size: 15px; }
.how5 span { color: var(--muted); }

.bing { font-family: var(--display); font-weight: 700; font-style: italic; font-size: 68px; line-height: 1; color: var(--lantern); text-align: center; margin: 0; }
.final { display: grid; gap: 8px; }
.final .row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface2); border-radius: 14px; font-weight: 700; border: 2px solid transparent; }
.final .row .lapn { margin-left: auto; }
.final .row.win { border-color: var(--lantern); }

.park { display: block; width: 100%; height: auto; border-radius: 22px; }
.tk { transition: transform 0.15s linear; }
.ov { opacity: 0; transition: opacity 0.6s; pointer-events: none; }
.ev-rain .ov-rain, .ev-sun .ov-sun, .ev-parade .ov-parade, .ev-picnic .ov-picnic, .ev-boat .ov-boat, .ev-fire .ov-fire { opacity: 1; }
.ev-fire .ov-fire { animation: fpop 1.6s ease-out infinite; transform-origin: 180px 180px; }
@keyframes fpop { 0% { opacity: 0.2; } 40% { opacity: 1; } 100% { opacity: 0.35; } }

.seg { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.seg:empty { display: none; }
.seglab { font-size: 12px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.seglab.sp { margin-left: 8px; }
.segb { min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--text); font-weight: 700; font-size: 14px; }
.segb.on { background: var(--lantern); border-color: var(--lantern); color: var(--ink); }
.segb:disabled { opacity: 0.4; }
.hintx { flex-basis: 100%; font-size: 12px; color: var(--muted); }

.legend { display: grid; gap: 10px; }
.lg { display: grid; grid-template-columns: 112px 1fr; gap: 10px; align-items: start; font-size: 14px; color: var(--muted); }
.lg .pill { justify-self: start; }

.foot { display: flex; flex-wrap: wrap; align-items: center; gap: 0 14px; color: var(--muted); font-size: 13px; }
.foot .mode { margin-left: auto; }
.foot:empty { display: none; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--paper); color: var(--ink); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; max-width: calc(100vw - 32px); opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 40; text-align: center; }
.toast.show { opacity: 1; }

.topr { display: flex; align-items: center; gap: 8px; flex: none; }
.chatbtn { position: relative; flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--rose); color: var(--rose-ink); display: flex; align-items: center; justify-content: center; }
.chatbtn svg { width: 22px; height: 22px; }
.badge { position: absolute; top: -4px; right: -4px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: #fff; color: var(--rose-ink); font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--night); }
.chat { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; max-width: 480px; margin: 0 auto; height: min(70vh, 560px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.5); padding-bottom: env(safe-area-inset-bottom, 0px); }
.chath { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px 18px; font-family: var(--display); font-size: 20px; }
.chatx { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; }
.chatx svg { width: 22px; height: 22px; }
.chatlist { flex: 1; overflow-y: auto; padding: 4px 16px 10px; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.helpbody { flex: 1; overflow-y: auto; padding: 4px 18px 22px; display: grid; gap: 14px; align-content: start; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.chatempty { margin: auto; color: var(--muted); font-size: 14px; }
.msg { max-width: 80%; padding: 8px 12px; border-radius: 18px; display: grid; gap: 2px; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--rose); color: var(--rose-ink); border-bottom-right-radius: 6px; }
.msg.them { align-self: flex-start; background: var(--surface2); border-bottom-left-radius: 6px; }
.mn { font-size: 11px; font-weight: 700; color: var(--muted); }
.mt { font-size: 16px; line-height: 1.3; }
.mm { font-size: 10px; opacity: .6; justify-self: end; }
.chatform { display: flex; gap: 8px; padding: 8px 12px 12px; border-top: 1px solid var(--line); }
.chatform input { flex: 1; min-width: 0; min-height: 48px; padding: 8px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--night); font-size: 16px; }
.send { flex: none; min-height: 48px; padding: 0 18px; border: 0; border-radius: 14px; background: var(--rose); color: var(--rose-ink); font-weight: 800; font-size: 16px; }
.chatform .send { border-radius: 999px; }
@media (max-width: 360px) {
  .q { font-size: 21px; }
  .two { grid-template-columns: 1fr; }
}

  }

function guessHTML(role, an, pn, c) {

function ttLabel(c) { return { wyr: "Would you rather", who: "Vote in secret", take: "Agree or disagree?", never: "Never have I ever" }[c.type] || "This or that"; }
function ttBody(c, an, pn, small) {

function ttVerdict(c, same) {

function playHTML() {

/* ================= Chat bubble (two-phone mode) ================= */

var Chat = (function () {
  var col = null, unsub = null, msgs = [], open = false, first = true, maxT = 0;
  var seen = Number(lsGet("weekone-chat-seen") || 0) || 0;

  function start(db) {
    try {
      col = db.collection("chat");
      unsub = col.orderBy("t", "desc").limit(60).onSnapshot(onSnap, function () { /* chat is optional */ });
    } catch (e) { col = null; }
    refresh();
  }

  function onSnap(qs) {
    var list = [];
    qs.docs.forEach(function (d) { var v = d.data(); if (v && v.tx) list.push(v); });
    list.sort(function (a, b) { return (a.t || 0) - (b.t || 0); });
    var prev = maxT;
    msgs = list;
    maxT = list.length ? list[list.length - 1].t || 0 : 0;
    if (!first && !open) {
      var fresh = list.filter(function (m) { return m.u !== uid && m.t > prev; });
      if (fresh.length) { var m = fresh[fresh.length - 1]; toast(m.n + ": " + String(m.tx).slice(0, 60)); bell(740, false); }
    }
    first = false;
    renderList();
    refresh();
  }

  function unread() {
    return msgs.filter(function (m) { return m.u !== uid && (m.t || 0) > seen; }).length;
  }

  function markSeen() {
    if (maxT > seen) { seen = maxT; lsSet("weekone-chat-seen", String(seen)); }
  }

  function fmt(t) {
    var d = new Date(t || 0), h = d.getHours(), m = d.getMinutes();
    return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
  }

  function renderList() {
    var el = $("chatlist");
    if (!el) return;
    if (!msgs.length) { el.innerHTML = '<p class="chatempty">No messages yet. Say hi.</p>'; return; }
    var h = "";
    msgs.forEach(function (m) {
      var mine = m.u === uid;
      h += '<div class="msg ' + (mine ? "me" : "them") + '">' + (mine ? "" : '<span class="mn">' + esc(m.n) + "</span>") + '<span class="mt">' + esc(m.tx) + '</span><span class="mm">' + fmt(m.t) + "</span></div>";
    });
    el.innerHTML = h;
    if (open) { markSeen(); el.scrollTop = el.scrollHeight; }
  }

  function refresh() {
    var btn = $("chatBtn"), badge = $("chatBadge");
    if (!btn) return;
    var show = mode === "sync" && !!col;
    btn.hidden = !show || open;
    var n = show ? unread() : 0;
    badge.textContent = n > 9 ? "9+" : String(n || "");
    badge.hidden = !n;
    if (!show && open) setOpen(false);
  }

  function setOpen(v) {
    open = !!v;
    $("chat").hidden = !open;
    if (open) {
      renderList(); markSeen();
      var el = $("chatlist"); if (el) el.scrollTop = el.scrollHeight;
      var inp = $("chatIn"); if (inp) { try { inp.focus(); } catch (e) { /* optional */ } }
    }
    refresh();
  }

  function send() {
    var inp = $("chatIn"), text = (inp.value || "").trim();
    if (!text || !col) return;
    if (readOnly) { toast("This account cannot send messages."); return; }
    var me0 = S && S.players && S.players[uid];
    var name = (me0 && me0.name) || lsGet("weekone-name") || "Guest";
    inp.value = ""; draft.chatIn = "";
    col.add({ u: uid, n: name, tx: text.slice(0, 280), t: Date.now() }).catch(function () {
      inp.value = text; toast("Message not sent. Check your connection.");
    });
  }

  return { start: start, refresh: refresh, open: function () { setOpen(true); }, close: function () { setOpen(false); }, send: send, isOpen: function () { return open; } };
})();


/* ================= Events and start ================= */

document.addEventListener("click", function (e) {
  var t = e.target.closest ? e.target.closest("[data-act]") : null;
  if (!t || t.disabled) return;
  var act = t.getAttribute("data-act"), i = parseInt(t.getAttribute("data-i"), 10), v = t.getAttribute("data-v");
  unlockAudio();
  switch (act) {
    case "join": doJoin(); break;
    case "start": doStart(); break;
    case "goLocal": startLocalMode(); break;
    case "startLocal": doStartLocal(); break;
    case "fig": draft.fig = v; lastPanel = ""; renderPanel(); break;
    case "swap": draft.swap = !draft.swap; renderPanel(); break;
    case "cby": draft.cby = v; renderPanel(); break;
    case "cuAdd": addCustom(mode === "local" ? (draft.cby === "L1" ? "L1" : "L0") : uid); if (mode === "local") { lastPanel = ""; renderPanel(); } break;
    case "cuDel": removeCustom(t.getAttribute("data-id")); break;
    case "redraw": doSwap(); break;
    case "help": $("help").hidden = false; break;
    case "helpx": $("help").hidden = true; break;
    case "stage": stageBig = !stageBig; renderShell(); break;
    case "dur": commit({ dur: parseInt(v, 10) }); break;
    case "energy": commit({ energy: v }); break;
    case "view": viewMode = v; lsSet("weekone-view4", viewMode); render(); break;
    case "cam": if (Park3D.active()) { Park3D.setCam(v); drawViewBar(); Park3D.sync(); } break;
    case "sound": soundOn = !soundOn; lsSet("weekone-sound", soundOn ? "on" : "off"); if (soundOn) bell(520, false); renderFoot(); break;
    case "pause": doPause(); break;
    case "chat": Chat.open(); break;
    case "chatx": Chat.close(); break;
    case "roll": doRoll(); break;
    case "evgo": doEventContinue(); break;
    case "talk1": endTalk(1); break;
    case "talk0": endTalk(0); break;
    case "caught": endStory(true); break;
    case "fooled": endStory(false); break;
    case "both1": endBoth(true); break;
    case "both0": endBoth(false); break;
    case "pickG": pickGuess(i); break;
    case "pickS": pickSelf(i); break;
    case "pickT": pickThis(i); break;
    case "next": doNext(); break;
    case "viewer": viewer = t.getAttribute("data-uid"); if (mode === "local") saveLocal(); render(); break;
    case "again": if (S) commit(againPatch(S)); break;
    case "restart":
      if (confirming) { confirming = false; clearTimeout(confirmTimer); if (S) commit(againPatch(S)); }
      else { confirming = true; renderFoot(); confirmTimer = setTimeout(function () { confirming = false; renderFoot(); }, 3000); }
      break;
  }
});

document.addEventListener("input", function (e) {
  var el = e.target;
  if (el && el.id) draft[el.id] = el.value;
});

document.addEventListener("change", function (e) {
  if (e.target && e.target.id === "prizeIn" && S) commit({ prize: String(e.target.value || "").trim().slice(0, 60) });
});

document.addEventListener("submit", function (e) { if (e.target && e.target.id === "chatform") { e.preventDefault(); Chat.send(); } });
document.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && e.target && e.target.id === "cuIn") { e.preventDefault(); var b = document.querySelector('[data-act="cuAdd"]'); if (b) b.click(); }
  if (e.key === "Escape") { $("help").hidden = true; }
});

document.addEventListener("visibilitychange", function () { if (!document.hidden) { tick(); render(); } });

async function init() {
  renderLegend();
  render();
  setInterval(tick, 500);
  setTimeout(function () { if (mode === "pending") { showEscape = true; render(); } }, 3500);
  var db = null, user = null;
  try {
    if (window.claude && typeof window.claude.use === "function") {
      db = await window.claude.use("db");
      user = await window.claude.use("user");
    }
  } catch (e) { db = null; }
  if (!db) { startLocalMode(); return; }
  mode = "sync";
  try { uid = user ? await user.id() : null; } catch (e) { uid = null; }
  if (!uid) uid = deviceId();
  try {
    var can = user ? await user.can("data.write") : null;
    if (can === false) readOnly = true;
  } catch (e) { /* unknown, let a write decide */ }
